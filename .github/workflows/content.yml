# The content policy (CONTENT_POLICY.md): nothing from the game disc, and every asset in ASSETS.tsv.
# Each push to main and each pull request. The mod itself is checked and packaged by build.yml.
name: content

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Content policy
        run: python tools/check_content.py
      - name: The check's own tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
